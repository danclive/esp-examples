[package]
name = "embassy_wifi"
version = "0.0.0"
description = "embassy_wifi"
readme = "README.md"
keywords = ["esp-hal", "esp32"]
license = "MIT"
edition = "2024"

[features]
default = [
    "esp32c6",
    "jtag",
    "log",
    "embassy",
    "wifi",
]

log = [
    "dep:log",
    "esp-bootloader-esp-idf/log-04",
    "esp-hal/log-04",
    "esp-println/log-04",
    "esp-backtrace/println",
    "esp-rtos/log-04",
    "embassy-executor?/log",
    "esp-radio?/log-04",
]

defmt = [
    "dep:defmt",
    "esp-bootloader-esp-idf/defmt",
    "esp-hal/defmt",
    "esp-println/defmt-espflash",
    "esp-backtrace/defmt",
    "esp-rtos/defmt",
    "embassy-executor?/defmt",
    "esp-radio?/defmt",
    "embassy-net?/defmt"
]

jtag = ["esp-println/jtag-serial"]
uart = ["esp-println/uart"]

esp32c3 = ["esp-bootloader-esp-idf/esp32c3", "esp-hal/esp32c3", "esp-println/esp32c3", "esp-backtrace/esp32c3", "esp-rtos/esp32c3", "esp-radio?/esp32c3",]
esp32c6 = ["esp-bootloader-esp-idf/esp32c6", "esp-hal/esp32c6", "esp-println/esp32c6", "esp-backtrace/esp32c6", "esp-rtos/esp32c6", "esp-radio?/esp32c6", ]

embassy = [
    "embassy-executor",
    "embassy-time",
    "esp-rtos/embassy",
]

wifi = [
    "esp-radio",
    "esp-radio/wifi",
    "esp-radio/csi",
    "esp-rtos/esp-radio",
    "embassy-net",
]

[dependencies]
esp-bootloader-esp-idf = { version = "0.5.0" }
esp-hal = { version = "=1.1.0-rc.0", features = ["unstable"] }
esp-println = { version = "0.17.0", default-features = false, features = ["critical-section", "colors"] }
esp-backtrace = { version = "0.19.0", features = ["panic-handler"]  }
esp-rtos = { version = "0.3", features = ["esp-alloc"] }

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4", optional = true }

embassy-executor = { version = "0.10", optional = true }
embassy-time = { version = "0.5", optional = true }

esp-radio  = { version = "0.18", features = ["unstable", "wifi"], optional = true }
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dhcpv4", "medium-ethernet"], optional = true }

static_cell = "2.1.1"
esp-alloc = { version = "0.10" }
