[package]
name = "rhai-example"
version = "0.0.0"
description = "rhai example"
readme = "README.md"
keywords = ["esp-hal", "esp32"]
license = "MIT"
edition = "2024"

[features]
default = [
    "esp32c6",
    "jtag",
    "log",
    "alloc",
    "rhai"
]

log = [
    "dep:log",
    "esp-bootloader-esp-idf/log-04",
    "esp-hal/log-04",
    "esp-println/log-04",
    "esp-backtrace/println",
]

defmt = [
    "dep:defmt",
    "esp-bootloader-esp-idf/defmt",
    "esp-hal/defmt",
    "esp-println/defmt-espflash",
    "esp-backtrace/defmt",
]

jtag = ["esp-println/jtag-serial"]
uart = ["esp-println/uart"]

esp32c3 = ["esp-bootloader-esp-idf/esp32c3", "esp-hal/esp32c3", "esp-println/esp32c3", "esp-backtrace/esp32c3"]
esp32c6 = ["esp-bootloader-esp-idf/esp32c6", "esp-hal/esp32c6", "esp-println/esp32c6", "esp-backtrace/esp32c6"]

alloc = [
    "esp-alloc",
]

rhai = [
    "dep:rhai",
    "rhai/f32_float",
    "rhai/only_i32"
]

[dependencies]
esp-bootloader-esp-idf = { version = "0.4.0" }
esp-hal = { version = "1.0.0", features = ["unstable"] }
esp-println = { version = "0.16.1", default-features = false, features = ["critical-section", "colors"] }
esp-backtrace = { version = "0.18.1", features = ["panic-handler"]  }

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4", optional = true }

esp-alloc = { version = "0.9", optional = true }

rhai = { version = "1.23", default-features = false, features = ["no_std"], optional = true }
critical-section = "1.2"

[profile.release]
lto = "fat"         # turn on Link-Time Optimizations
codegen-units = 1   # trade compile time with maximum optimization
opt-level = "z"     # optimize for size
